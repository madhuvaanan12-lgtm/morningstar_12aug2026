name: Apply Morningstar garden logo

on:
  push:
    branches:
      - agent/ten-day-morningstar-updates
    paths:
      - .github/workflows/apply-garden-logo.yml

permissions:
  contents: write

jobs:
  apply-logo:
    runs-on: ubuntu-latest
    steps:
      - name: Check out development branch
        uses: actions/checkout@v4
        with:
          ref: agent/ten-day-morningstar-updates
          fetch-depth: 0

      - name: Install garden logo and brand styling
        shell: python
        run: |
          from pathlib import Path
          import base64

          logo_b64 = """"""

          assets = Path("assets")
          assets.mkdir(exist_ok=True)
          logo_path = assets / "morningstar-garden-logo.jpg"
          logo_path.write_bytes(base64.b64decode(logo_b64))

          index_path = Path("index.html")
          html = index_path.read_text(encoding="utf-8")
          marker = 'id="morningstar-garden-logo-theme"'
          if marker not in html:
              style = '''
    <style id="morningstar-garden-logo-theme">
      .wordmark,
      .footer-mark {
        color: transparent !important;
        font-size: 0 !important;
        letter-spacing: 0 !important;
        background-image: url('/assets/morningstar-garden-logo.jpg') !important;
        background-repeat: no-repeat !important;
        overflow: hidden;
      }

      .wordmark {
        width: 210px;
        height: 58px;
        flex: none;
        border-radius: 8px;
        background-size: cover !important;
        background-position: center top !important;
        box-shadow: 0 0 0 1px #39ff1438, 0 8px 25px #0000005c;
      }

      .wordmark span,
      .wordmark i,
      .footer-mark span,
      .footer-mark i {
        display: none !important;
      }

      .footer-mark {
        width: min(360px, 82vw);
        height: 240px;
        opacity: 1 !important;
        transform: none !important;
        border-radius: 12px;
        background-size: contain !important;
        background-position: center !important;
      }

      @media (max-width: 820px) {
        .wordmark {
          width: 165px;
          height: 50px;
        }
        .footer-mark {
          width: min(310px, 88vw);
          height: 207px;
        }
      }

      @media (max-width: 470px) {
        .wordmark {
          width: 145px;
          height: 46px;
        }
      }
    </style>
'''
              html = html.replace("  </head>", style + "  </head>", 1)
              index_path.write_text(html, encoding="utf-8")

      - name: Commit logo change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/morningstar-garden-logo.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Use garden artwork as Morningstar logo"
            git push origin HEAD:agent/ten-day-morningstar-updates
          fi
