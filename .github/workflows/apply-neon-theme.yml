name: Wire Morningstar garden brand stylesheet

on:
  push:
    branches:
      - agent/ten-day-morningstar-updates
    paths:
      - .github/workflows/apply-neon-theme.yml

permissions:
  contents: write

jobs:
  wire-brand:
    runs-on: ubuntu-latest
    steps:
      - name: Check out development branch
        uses: actions/checkout@v4
        with:
          ref: agent/ten-day-morningstar-updates
          fetch-depth: 0

      - name: Add garden brand stylesheet link
        shell: python
        run: |
          from pathlib import Path

          path = Path("index.html")
          html = path.read_text(encoding="utf-8")
          marker = '<link rel="stylesheet" href="/assets/morningstar-brand.css" />'
          if marker not in html:
              html = html.replace("  </head>", f"    {marker}\n  </head>", 1)
              path.write_text(html, encoding="utf-8")

      - name: Commit stylesheet link
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Use garden artwork as Morningstar logo"
            git push origin HEAD:agent/ten-day-morningstar-updates
          fi
