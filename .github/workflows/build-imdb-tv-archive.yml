name: Build complete IMDb TV archive

on:
  push:
    branches:
      - agent/imdb-complete-tv-archive
    paths:
      - "research/import-imdb-tv.py"
      - "imdb-archive.js"
      - ".github/workflows/build-imdb-tv-archive.yml"
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/imdb-complete-tv-archive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build archive from official IMDb datasets
        run: python research/import-imdb-tv.py

      - name: Validate generated code and files
        run: |
          python -m py_compile research/import-imdb-tv.py
          node --check imdb-archive.js
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path('data/imdb/manifest.json').read_text(encoding='utf-8'))
          assert manifest['totalTitles'] == manifest['seriesTitles'] + manifest['miniSeriesTitles']
          assert manifest['totalTitles'] > 300000
          assert manifest['files']
          total = 0
          for entry in manifest['files']:
              path = Path('data/imdb') / entry['file']
              rows = json.loads(path.read_text(encoding='utf-8'))
              assert len(rows) == entry['count']
              total += len(rows)
          assert total == manifest['totalTitles']
          assert '<script defer src="./imdb-archive.js"></script>' in Path('index.html').read_text(encoding='utf-8')
          print(f"Validated {total:,} IMDb TV titles across {len(manifest['files'])} chunks")
          PY
          git diff --check

      - name: Commit generated IMDb archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/imdb research/imdb-tv-import-report.json index.html README.md
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Import complete IMDb TV series archive"
          git push origin HEAD:agent/imdb-complete-tv-archive
