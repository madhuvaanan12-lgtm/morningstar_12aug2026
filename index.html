    <style>
      /* Collapsible filter dock and catalogue display modes. */
      .filter-dock {
        z-index: 40;
        position: sticky;
        top: 71px;
        margin: 0 0 34px;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: #0f1114f2;
        -webkit-backdrop-filter: blur(18px);
        backdrop-filter: blur(18px);
        box-shadow: 0 14px 40px #00000038;
      }

      .filter-dock-toggle {
        color: #e9e5df;
        cursor: pointer;
        width: 100%;
        min-height: 48px;
        padding: 8px 13px;
        background: transparent;
        border: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        text-align: left;
      }

      .filter-dock:not(.collapsed) .filter-dock-toggle {
        border-bottom: 1px solid var(--line);
      }

      .filter-dock-toggle > span:first-child {
        min-width: 0;
        display: flex;
        flex-direction: column;
      }

      .filter-dock-toggle b {
        font-size: 11px;
        letter-spacing: 0.04em;
      }

      .filter-dock-toggle small {
        color: #77746f;
        margin-top: 2px;
        font-size: 8px;
      }

      .filter-dock-toggle > span:last-child {
        color: #aaa7a1;
        flex: none;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 9px;
        font-weight: 720;
      }

      .filter-dock-toggle svg {
        transition: transform 0.2s;
      }

      .filter-dock:not(.collapsed) .filter-dock-toggle svg {
        transform: rotate(180deg);
      }

      .filter-dock-panel {
        overflow: visible;
      }

      .filter-dock .filter-bar {
        position: static;
        top: auto;
        margin: 0;
        border: 0;
        border-radius: 0;
        background: transparent;
        -webkit-backdrop-filter: none;
        backdrop-filter: none;
        box-shadow: none;
      }

      .filter-dock .curslick-filter {
        margin: 0;
        background: transparent;
      }

      .curslick-filter-dock {
        border-color: #ffca6930;
        background: #161512f2;
      }

      .exclusion-controls {
        padding: 12px 13px 14px;
        border-bottom: 1px solid var(--line);
        background: #ff453a08;
      }

      .exclusion-heading {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 14px;
      }

      .exclusion-heading b {
        color: #f1ece6;
        font-size: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .exclusion-heading small {
        color: #85817b;
        margin-top: 2px;
        font-size: 8px;
        display: block;
      }

      .exclusion-heading button {
        color: var(--coral);
        cursor: pointer;
        flex: none;
        padding: 0;
        border: 0;
        background: transparent;
        font-size: 9px;
        font-weight: 750;
      }

      .exclusion-grid {
        margin-top: 10px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
        gap: 7px;
      }

      .exclusion-chip {
        color: #97948f;
        cursor: pointer;
        min-width: 0;
        min-height: 46px;
        padding: 7px 10px;
        border: 1px solid #ffffff17;
        border-radius: 5px;
        background: #202329;
        display: flex;
        align-items: center;
        gap: 9px;
      }

      .exclusion-chip input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }

      .exclusion-chip .exclusion-box {
        color: transparent;
        flex: none;
        width: 19px;
        height: 19px;
        border: 1px solid #64625f;
        border-radius: 4px;
        display: grid;
        place-items: center;
      }

      .exclusion-chip.active {
        color: #f4ece9;
        border-color: #ff6f5f6b;
        background: #7a2b2333;
      }

      .exclusion-chip.active .exclusion-box {
        color: #2a0d09;
        border-color: var(--coral);
        background: var(--coral);
      }

      .exclusion-copy {
        min-width: 0;
      }

      .exclusion-copy b {
        font-size: 9.5px;
        line-height: 1.25;
        display: block;
      }

      .exclusion-copy small {
        color: #7f7c77;
        margin-top: 2px;
        font-size: 8px;
        line-height: 1.3;
        display: block;
      }

      .card-original-title {
        color: #8b8883;
        margin: 3px 0 0;
        font-size: 9px;
        line-height: 1.3;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .view-list .card-original-title,
      .view-detailed .card-original-title {
        white-space: normal;
        font-size: 10px;
      }

      .curslick-original-title {
        color: #8f8b84;
        margin: 6px 0 0;
        font-size: 11px;
        line-height: 1.3;
      }

      .display-controls {
        min-height: 62px;
        padding: 10px 12px;
        border-bottom: 1px solid var(--line);
        display: grid;
        grid-template-columns: minmax(145px, auto) minmax(280px, 1fr) minmax(120px, 170px);
        align-items: center;
        gap: 12px;
      }

      .display-heading {
        min-width: 0;
        display: flex;
        flex-direction: column;
      }

      .display-heading b {
        color: #eeeae4;
        font-size: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .display-heading small {
        color: #77746f;
        margin-top: 2px;
        font-size: 8px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .view-mode-switch {
        padding: 3px;
        border: 1px solid #ffffff17;
        border-radius: 6px;
        background: #090a0c73;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 3px;
      }

      .view-mode-switch button {
        color: #8f8c87;
        cursor: pointer;
        min-height: 34px;
        padding: 0 10px;
        border: 1px solid transparent;
        border-radius: 4px;
        background: transparent;
        font-size: 9px;
        font-weight: 740;
      }

      .view-mode-switch button.active {
        color: #fff;
        border-color: #ffffff24;
        background: #2a2d34;
        box-shadow: 0 4px 12px #00000038;
      }

      .column-control {
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .column-control > span {
        color: #7d7b77;
        text-transform: uppercase;
        letter-spacing: 0.13em;
        font-size: 8px;
      }

      .column-control select {
        color: #dedbd6;
        width: 100%;
        height: 34px;
        padding: 0 25px 0 9px;
        border: 1px solid #ffffff17;
        border-radius: 4px;
        background: #202329;
        outline: none;
        font-size: 10px;
      }

      .poster-error-fallback {
        position: absolute;
        inset: 0;
        z-index: 0;
      }

      .poster-shell > img,
      .curslick-poster > img {
        position: relative;
        z-index: 1;

  <body>
    <div id="root"><main class="loading-screen"><div class="loading-mark">M</div><p>Opening Morningstar…</p></main></div>

  <script>
    (async () => {
      const root = document.getElementById("root");
      try {
        const manifestResponse = await fetch("/data/manifest.json", { cache: "no-cache" });
        if (!manifestResponse.ok) throw new Error("Morningstar data manifest is unavailable");
        const manifest = await manifestResponse.json();
        const partResponses = await Promise.all(
          manifest.parts.map((part) => fetch(`/data/${part}`)),
        );
        if (partResponses.some((response) => !response.ok)) {
          throw new Error("One or more Morningstar data files are unavailable");
        }
        const chunks = await Promise.all(partResponses.map((response) => response.text()));
        window.__MORNINGSTAR_DATA__ = JSON.parse(chunks.join(""));

        const app = document.createElement("script");
        app.src = "/app.js";
        app.onerror = () => {
          root.innerHTML =
            '<main class="loading-screen"><div class="loading-mark">!</div><p>Morningstar could not load. Please refresh the page.</p></main>';
        };
        document.body.appendChild(app);
      } catch (error) {
        console.error(error);
        root.innerHTML =
          '<main class="loading-screen"><div class="loading-mark">!</div><p>Morningstar could not load. Please refresh the page.</p></main>';
      }
    })();
  </script>
